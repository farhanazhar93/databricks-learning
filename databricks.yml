# This is a Declarative Automation Bundle definition for dab_learning.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab_learning
  uuid: 32a9e77e-1dc3-447b-94eb-9cdee80c3553

# This bundle is intended to be deployed to a Databricks workspace. It contains resources such as notebooks, jobs, and clusters that can be deployed together.
include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  bronze_schema:
    description: The schema to use
  silver_schema:
    description: The schema to use
  gold_schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-f8d97078-8a74.cloud.databricks.com?w=7474645526729790
    variables:
      catalog: dev
      bronze_schema: bronze
      silver_schema: silver
      gold_schema: gold
       
  prod:
    mode: production
    workspace:
      host: https://dbc-f8d97078-8a74.cloud.databricks.com?w=7474645526729790
      # We explicitly deploy to /Workspace/Users/mohdfarhanmohdazhar@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/mohdfarhanmohdazhar@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prod
      bronze_schema: bronze
      silver_schema: silver
      gold_schema: gold
    permissions:
      - user_name: mohdfarhanmohdazhar@gmail.com
        level: CAN_MANAGE
