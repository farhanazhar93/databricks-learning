resources:
  jobs:
    customer_ingestion_job:

      name: job_customer_ingestion_files_to_delta

      tasks:
        - task_key: customer_ingestion_task

          spark_python_task:
            python_file: ../src/cust_ingestion.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.bronze_schema}

          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "5"