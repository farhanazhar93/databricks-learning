# The main pipeline for dab_learning

resources:
  pipelines:
    dab_learning_etl:
      name: dab_learning_etl
      catalog: ${var.catalog}
      schema: ${var.bronze_schema}
      serverless: true
      root_path: "../src/dab_learning_etl"

      libraries:
        - glob:
            include: ../src/dab_learning_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
